<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <!-- Halftone Dot Pattern for Sacred Groves & Reserves -->
    <pattern id="bg-halftone-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.8" fill="#141414" fill-opacity="0.3" />
    </pattern>

    <!-- Faint Survey Grid Pattern -->
    <pattern id="bg-survey-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#141414" stroke-width="0.5" stroke-opacity="0.12" />
      <path d="M 58 60 L 62 60 M 60 58 L 60 62" fill="none" stroke="#141414" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- 1. Coordinate Survey Grid Layer -->
  <rect width="100%" height="100%" fill="url(#bg-survey-grid)" opacity="0.6" />

  <!-- 2. Sacred Groves & Terrain Halftone Zones -->
  <!-- Tapovan Forest Area -->
  <path d="M 950 420 C 1050 400, 1200 440, 1260 520 C 1220 620, 1080 640, 980 580 Z" fill="url(#bg-halftone-dots)" />
  <!-- Panchavati Heritage Grove -->
  <path d="M 720 280 C 820 260, 920 300, 900 400 C 840 430, 750 410, 710 350 Z" fill="url(#bg-halftone-dots)" />
  <!-- Ramshej / North Ridge Foot -->
  <path d="M 200 120 C 400 90, 700 110, 850 180 C 650 210, 350 200, 180 160 Z" fill="url(#bg-halftone-dots)" />

  <!-- 3. River Godavari Waterway Corridor (Ink Outline & Light Channel) -->
  <path
    d="M -50 450 C 220 420, 480 560, 780 510 C 1060 460, 1260 340, 1650 360 L 1650 420 C 1260 400, 1060 520, 780 570 C 480 620, 220 480, -50 510 Z"
    fill="#141414"
    fill-opacity="0.04"
  />
  <path
    d="M -50 450 C 220 420, 480 560, 780 510 C 1060 460, 1260 340, 1650 360"
    stroke="#141414"
    stroke-width="1.6"
    stroke-opacity="0.5"
    fill="none"
  />
  <path
    d="M -50 510 C 220 480, 480 620, 780 570 C 1060 520, 1260 400, 1650 420"
    stroke="#141414"
    stroke-width="1.6"
    stroke-opacity="0.5"
    fill="none"
  />

  <!-- 4. Real Major Arterial Road Corridors (Near-Black Ink #141414) -->
  <!-- Mumbai - Agra National Highway (NH-3 / NH-160 Corridor) -->
  <path
    d="M 120 980 C 320 820, 520 620, 760 490 C 980 370, 1240 210, 1520 40"
    stroke="#141414"
    stroke-width="2.6"
    stroke-opacity="0.6"
    fill="none"
  />

  <!-- Trimbak Road (Connecting West Trimbakeshwar to Central Nashik) -->
  <path
    d="M -40 760 C 220 720, 450 680, 680 560 C 740 530, 780 510, 810 500"
    stroke="#141414"
    stroke-width="2.2"
    stroke-opacity="0.6"
    fill="none"
  />

  <!-- Nashik Road Axis (Connecting Railway Station Hub to Central Ghats) -->
  <path
    d="M 1520 920 C 1320 860, 1140 780, 960 670 C 860 600, 800 540, 780 510"
    stroke="#141414"
    stroke-width="2.2"
    stroke-opacity="0.6"
    fill="none"
  />

  <!-- Gangapur Road (Northwest Corridor) -->
  <path
    d="M 180 260 C 380 320, 560 410, 730 480"
    stroke="#141414"
    stroke-width="1.4"
    stroke-opacity="0.45"
    fill="none"
  />

  <!-- Dindori Road (North Corridor) -->
  <path
    d="M 760 -20 C 770 180, 780 350, 780 480"
    stroke="#141414"
    stroke-width="1.4"
    stroke-opacity="0.45"
    fill="none"
  />

  <!-- Outer Ring Road Bypass Corridor -->
  <path
    d="M 180 880 C 450 960, 1100 960, 1420 820 C 1580 620, 1540 320, 1360 160 C 1140 40, 480 40, 240 180 C 80 340, 60 700, 180 880 Z"
    stroke="#141414"
    stroke-width="1.2"
    stroke-dasharray="8 6"
    stroke-opacity="0.35"
    fill="none"
  />

  <!-- Secondary Connecting Streets Grid -->
  <g stroke="#141414" stroke-width="0.8" stroke-opacity="0.3" fill="none">
    <path d="M 640 420 L 880 420 L 920 540 L 680 560 Z" />
    <path d="M 710 460 L 850 460" />
    <path d="M 740 380 L 740 520" />
    <path d="M 820 380 L 820 520" />
    <path d="M 520 620 L 680 720" />
    <path d="M 880 580 L 1020 720" />
    <path d="M 980 460 L 1180 460" />
    <path d="M 1060 380 L 1060 560" />
  </g>

  <!-- 5. Concentric Geodetic Rings Centered on Sacred Ramkund (X: 780, Y: 510) -->
  <circle cx="780" cy="510" r="90" stroke="#141414" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.3" fill="none" />
  <circle cx="780" cy="510" r="180" stroke="#141414" stroke-width="0.6" stroke-opacity="0.2" fill="none" />
  <circle cx="780" cy="510" r="320" stroke="#141414" stroke-width="0.5" stroke-dasharray="6 6" stroke-opacity="0.15" fill="none" />

  <!-- Waypoint Reticle at Ramkund -->
  <g transform="translate(780, 510)">
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#141414" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#141414" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="3" fill="#141414" fill-opacity="0.5" />
  </g>

  <!-- Corner Survey Tick Marks -->
  <g stroke="#141414" stroke-width="1" stroke-opacity="0.3">
    <path d="M 20 40 L 40 40 M 40 20 L 40 40" />
    <path d="M 1580 40 L 1560 40 M 1560 20 L 1560 40" />
    <path d="M 20 960 L 40 960 M 40 980 L 40 960" />
    <path d="M 1580 960 L 1560 960 M 1560 980 L 1560 960" />
  </g>
</svg>
